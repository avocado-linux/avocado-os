[Service]
# dockerd cannot verify any registry without /etc/ssl/certs/ca-certificates.crt,
# and nothing on a merged device builds it: ca-certificates generates it from a
# postinst that never runs for a sysext, and update-ca-certificates needs an
# openssl the minimal rootfs cannot run. See the script for the detail.
#
# Run on every start rather than once, because /etc is not persistent here - a
# bundle written by hand does not survive a reboot, so the device repairs itself
# each time docker comes up.
ExecStartPre=/usr/libexec/avocado/update-ca-bundle

[Service]
# ca-certificates ships the certs but builds /etc/ssl/certs/ca-certificates.crt
# in a postinst, which runs from run-postinsts on first boot of a normal image
# and never runs at all for a sysext - the extension is merged read-only, with
# no equivalent hook. A merged device therefore has
# /usr/share/ca-certificates/mozilla/*.crt and an empty /etc/ssl/certs, and
# every registry pull fails with:
#
#   tls: failed to verify certificate: x509: certificate signed by unknown authority
#
# The device cannot repair this itself either: update-ca-certificates shells out
# to openssl, and the minimal rootfs ships libcrypto.so.3 without libssl.so.3,
# so openssl exits on a missing shared library.
#
# Concatenating the Mozilla certs produces the same bundle without needing
# openssl. Guarded on the file being absent or empty so an operator who has
# installed a private or corporate CA keeps it - the reference implementation in
# references/docker-registry rewrites the bundle on every start, which would
# silently discard that on the next docker restart.
ExecStartPre=/bin/sh -c 'test -s /etc/ssl/certs/ca-certificates.crt || cat /usr/share/ca-certificates/mozilla/*.crt > /etc/ssl/certs/ca-certificates.crt'

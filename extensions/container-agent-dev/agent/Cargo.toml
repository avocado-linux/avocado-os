[package]
name = "avocado-container-agent-dev"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "avocado-container-agent-dev"
path = "src/main.rs"

[dependencies]
# `sync` is used directly (`Notify` for the sync-worker wakeup and the
# re-bootstrap signal, `mpsc` for the outbound frame channel). It builds today
# only because hyper 1.x depends on tokio with `sync` enabled and cargo unifies
# features - `cargo tree -e features -i tokio` shows it sourced from hyper, not
# from here. A hyper bump that drops that dependency would break this crate with
# no local change, so the feature it actually uses is declared.
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "time",
    "io-util",
    "process",
    "sync",
] }
# WS client only. We deliberately DO NOT enable tokio-tungstenite's
# `rustls-tls-*` features: those pull `tokio-rustls` with its default features,
# which selects the `aws_lc_rs` crypto provider (forbidden on the device — A9
# clears the `ring` stack for the musl cross targets, same rule avocado-conn
# enforces). Instead we establish TLS ourselves with a ring-only
# `tokio-rustls::TlsConnector` and hand the stream to `client_async`, so
# `aws-lc-rs` never enters the tree.
tokio-tungstenite = { version = "0.26", default-features = false, features = [
    "handshake",
] }
tokio-rustls = { version = "0.26", default-features = false, features = [
    "ring",
    "logging",
    "tls12",
] }
# Direct rustls dep so we can build a `ClientConfig` pinned to the ring
# provider and install it as the process default (defense-in-depth), matching
# avocado-conn's explicit-vertex pattern.
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "logging",
    "std",
    "tls12",
] }
rustls-pemfile = "2"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Loopback registry proxy (task 6.2). hyper is a pure-Rust HTTP/1 stack with no
# crypto of its own; the upstream leg's TLS is driven by the same ring-backed
# `tokio-rustls`/`rustls` above, so no `aws-lc-rs` enters the tree. We
# deliberately do NOT use `reqwest`, whose default rustls would pull `aws-lc-rs`.
hyper = { version = "1", default-features = false, features = [
    "server",
    "client",
    "http1",
] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"

[dev-dependencies]
# Throwaway CA/leaf generation for the in-process TLS upstream in proxy tests.
# `ring` (not the crate default `aws_lc_rs`) so the pinned-CA test stack matches
# the agent's own ring provider and keeps `aws-lc-rs` out of the tree entirely.
rcgen = { version = "0.13", default-features = false, features = [
    "crypto",
    "pem",
    "ring",
] }
# Virtual time for the proxy's accept-retry tests: `start_paused` lets them assert
# the backoff elapsed without spending it, which both pins the sleep and keeps the
# suite fast. Dev-only - the edition-2024 resolver keeps it out of the shipped binary.
tokio = { version = "1", features = ["test-util"] }
# Temp dir standing in for the writable partition in the sync pointer tests.
tempfile = "3"

[profile.release]
strip = true
lto = true

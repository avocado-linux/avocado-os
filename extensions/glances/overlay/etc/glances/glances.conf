# Avocado Glances configuration.
#
# This file is THE knob for device telemetry. It controls both:
#   * WHAT is collected  — per-plugin sections (every plugin is ON by default)
#   * WHERE it is sent    — exporter sections (e.g. [mqtt])
#
# Full reference: https://glances.readthedocs.io/en/latest/config.html
# After editing:  systemctl restart avocado-glances

##############################################################################
# WHAT to collect — enable/disable plugins
##############################################################################
# Disable a plugin you don't want reported, e.g.:
#   [network]
#   disable=True
#
# High-cardinality plugins are disabled by default to keep backend cost bounded
# (per-process / per-connection data explodes cardinality). Re-enable if needed.
[processlist]
disable=True

[connections]
disable=True

# Example: raise an alert threshold (see docs for per-plugin options)
# [cpu]
# user_careful=50
# user_warning=70
# user_critical=90

##############################################################################
# WHERE to send it
##############################################################################
# DEFAULT (Milestone 2): RESTful export to the local bridge, which forwards to
# avocado-conn's single authenticated MQTT session (event/{id}). Keeps one cloud
# connection with per-device auth + cardinality control. host/port must match
# /etc/glances/avocado-glances-bridge.env. Activated by `--export restful`.
[restful]
host=127.0.0.1
port=6789
protocol=http
path=/

# ALTERNATIVE (Milestone 1 / quick local test): push straight to an MQTT broker.
# Switch avocado-glances.env to `--export mqtt` and configure below.
# [mqtt]
# host=127.0.0.1
# port=1883
# user=
# password=
# tls=false
# topic=avocado/glances

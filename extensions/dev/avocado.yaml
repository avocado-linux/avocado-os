supported_targets: '*'

distro:
  release: 2024
  channel: edge

extensions:
  avocado-ext-dev:
    version: 2024.1.0
    release: r0
    summary: Avocado development tools
    description: Avocado development tools
    license: Apache-2.0
    url: https://github.com/avocadolinux/avocado-os
    vendor: Avocado Linux <info@avocadolinux.org>

    enable_services:
      - avocado-grow-var.service

    on_merge:
      # Kick the one-shot resize right after the extension is merged so
      # the user doesn't have to wait for the next boot. The service is
      # guarded by /var/lib/avocado/.resized-var, so subsequent boots
      # are no-ops.
      - systemctl start --no-block avocado-grow-var.service

    overlay: overlays/base

    packages:
      avocado-hitl: '*'
      rsync: '*'
      # Used by /usr/bin/avocado-grow-var (shipped via the overlay).
      # The script branches on partition-table type:
      #   - GPT (imx, x86-64, alif, stm, qemu, renesas, rockchip,
      #     synaptics, nvidia, qcom): gptfdisk (sgdisk) relocates the
      #     backup GPT header and rewrites the partition entry.
      #   - MBR (raspberrypi family — fwup mbr layout): util-linux-sfdisk
      #     grows the last partition in place.
      # util-linux-partx then tells the kernel about the new size via
      # BLKPG; btrfs-tools (already in the base rootfs) grows the
      # filesystem online; util-linux-{findmnt,lsblk} discover the var
      # device, parent disk, partition number, and table type.
      gptfdisk: '*'
      util-linux-findmnt: '*'
      util-linux-lsblk: '*'
      util-linux-partx: '*'
      util-linux-sfdisk: '*'

    sdk:
      packages:
        nativesdk-avocado-hitl: '*'
        nativesdk-openssh-scp: '*'
        nativesdk-openssh-ssh: '*'
        nativesdk-rsync: '*'

sdk:
  image: docker.io/avocadolinux/sdk:{{ avocado.distro.release }}-{{ avocado.distro.channel }}

  packages:
    # avocado-cli emits an erofs formatter call for every extension whose type
    # is erofs (commands/ext/image.rs:921) without declaring the tool it needs,
    # so on a clean SDK the content builds and the image step then dies on
    # command-not-found.
    #
    # avocado-debt: per-project workaround for a CLI/SDK gap. Ceiling:
    # one project at a time - most of the in-tree bsp/ and extensions/ configs
    # still lack this and fail identically the moment someone builds them on a
    # clean SDK. Upgrade trigger: avocado-cli declares the formatter alongside
    # the call site, or the SDK image ships it - then delete this block rather
    # than copying it to the next config.
    nativesdk-erofs-utils: '*'

# Bringup only: every serial console logs in as root without a password. The base rootfs ships root locked (root:*), so
# without this a fresh board has no way in from the console. DO NOT USE IN PRODUCTION.
[Service]
ExecStart=
ExecStart=-/usr/sbin/agetty --noreset --noclear --autologin root --keep-baud 115200,57600,38400,9600 - ${TERM}

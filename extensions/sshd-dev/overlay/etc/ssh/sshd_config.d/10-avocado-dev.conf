# Dev access policy for avocado-ext-sshd-dev. DO NOT USE IN PRODUCTION.
#
# This lives in a drop-in rather than in the sshd_config copies next to it
# because the extension does not get to choose which of those sshd is started
# with. An image built with read-only-rootfs (every Avocado image -
# avocado-image-rootfs.bb sets it) makes oe-core write
# SSHD_OPTS='-f /etc/ssh/sshd_config_readonly' into /etc/default/ssh, so the
# settings in sshd_config are simply never read there. Both files carry
# `Include /etc/ssh/sshd_config.d/*.conf` on line 13, and OpenSSH takes the
# FIRST value it sees for a keyword, so a drop-in is authoritative either way
# and stays correct if a future openssh bump rewrites the shipped copies.
PermitRootLogin yes
PasswordAuthentication yes
PermitEmptyPasswords yes

# /root lives on the read-only erofs rootfs, so the default ~/.ssh/authorized_keys
# cannot be created on a running board - `mkdir /root/.ssh` fails with EROFS, and
# baking a key in means a reflash for every key change. /var is the writable
# filesystem and already holds this extension's host keys, so read authorized
# keys from there first. The home-relative path is kept as a fallback for images
# whose rootfs is writable.
#
# This path matters more than it looks: empty-password login is not a dependable
# way in. OpenSSH 10.3 hands PAM_DISALLOW_NULL_AUTHTOK to pam_authenticate
# whenever PermitEmptyPasswords is off (auth-pam.c:491), and on an image where
# it resolved to off, an empty root password is refused before PAM ever runs -
# observed on an imx93-frdm wrynose build with root's shadow field empty. A key
# is the mechanism that does not depend on any of that.
AuthorizedKeysFile /var/lib/ssh/authorized_keys .ssh/authorized_keys
